<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/texture/coqui/coqui.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <link rel="preload" href="/models/Patio/patio-draco.glb" as="fetch" crossorigin>
    <link rel="preload" href="/models/human/human-walk-draco.glb" as="fetch" crossorigin>
    <link rel="preload" href="/basis/basis_transcoder.wasm" as="fetch" crossorigin>
</head>
<body>
    <canvas class="webgl"></canvas>

    <!-- Dark cover while renderer initializes (fades to reveal 3D preloader) -->
    <div class="initial-cover" id="initial-cover"></div>

    <!-- Cloud transition overlay (slides in after orbit, contains loading UI) -->
    <div class="cloud-transition" id="cloud-transition">
        <div class="cloud-transition-content">
            <h1 class="cloud-title">Portfolio</h1>
            <button class="cloud-btn" id="loading-enter-btn" disabled>
                <span class="cloud-btn-fill" id="progress-fill"></span>
                <span class="cloud-btn-text" id="progress-btn-text">0%</span>
                <svg class="cloud-btn-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay">
        <div class="modal-container">
            <button class="modal-close">&times;</button>
            <h2 class="modal-title">Title</h2>
            <div class="modal-body">
                <p>Content goes here...</p>
            </div>
        </div>
    </div>
    
    <script type="module" src="./script.js"></script>
</body>
</html>
