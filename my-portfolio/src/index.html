<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/favicon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <link rel="preload" href="/models/human/human-walk-draco.glb" as="fetch" crossorigin>
    <link rel="preload" href="/basis/basis_transcoder.wasm" as="fetch" crossorigin>
</head>
<body>
    <canvas class="webgl"></canvas>

    <!-- Dark cover while renderer initializes (fades to reveal 3D preloader) -->
    <div class="initial-cover" id="initial-cover"></div>

    <!-- Cloud transition overlay (slides in after orbit, contains loading UI) -->
    <div class="cloud-transition" id="cloud-transition">
        <div class="loading-scene" aria-hidden="true">
            <span class="sky-layer sky-day"></span>
            <span class="sky-layer sky-sunset"></span>
            <span class="sky-layer sky-night"></span>
            <div class="loading-celestial">
                <span class="loading-sun"></span>
                <span class="loading-moon"></span>
            </div>
            <span class="loading-cloud lc1"></span>
            <span class="loading-cloud lc2"></span>
            <span class="loading-cloud lc3"></span>
            <span class="loading-nightveil"></span>
            <span class="loading-stars"></span>
            <svg class="loading-waves" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
                <path class="wave wave-3" d="M-200,150 C140,95 380,162 720,120 C1060,80 1300,150 1640,112 L1640,320 L-200,320 Z"/>
                <path class="wave wave-2" d="M-200,212 C160,256 430,166 720,206 C1020,246 1260,180 1640,226 L1640,320 L-200,320 Z"/>
                <path class="wave wave-1" d="M-200,252 C120,208 350,300 640,262 C940,222 1250,300 1640,256 L1640,320 L-200,320 Z"/>
            </svg>
        </div>
        <div class="cloud-transition-content">
            <h1 class="cloud-title">Sergii's Portfolio</h1>
            <div class="cloud-actions">
                <button class="cloud-btn" id="loading-enter-btn" disabled>
                    <span class="cloud-btn-fill" id="progress-fill"></span>
                    <span class="cloud-btn-text" id="progress-btn-text">0%</span>
                    <svg class="cloud-btn-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
                <!-- Needs none of the 3D assets, so it is live from the first
                     frame — the whole point is not waiting for the world. -->
                <button class="cloud-btn-alt" id="loading-overview-btn" type="button">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h10"/>
                    </svg>
                    <span>Quick overview</span>
                </button>
            </div>
        </div>
    </div>

    <button type="button" class="quality-fab" id="quality-fab-btn"
        aria-label="Calidad"
        aria-haspopup="dialog" aria-expanded="false" aria-controls="quality-modal">
        <svg class="quality-fab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none"
            xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.76 1.1 1.36 1.36h.09a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
                stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <!-- Quality settings now live in the central SettingsModal (World/ui). -->

    <!-- Modal Overlay -->
    <div class="modal-overlay">
        <div class="modal-container">
            <button class="modal-close">&times;</button>
            <h2 class="modal-title">Title</h2>
            <div class="modal-body">
                <p>Content goes here...</p>
            </div>
        </div>
    </div>
    
    <script type="module" src="./script.js"></script>
</body>
</html>
