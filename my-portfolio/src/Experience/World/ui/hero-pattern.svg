<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    GENERATED — see scratchpad/gen-pattern.mjs. Do not hand-edit; regenerate.

    Tile for the Quick Overview hero. Tomodachi Life's menus use a tone-on-tone
    doodle field; these are the same idea drawn from THIS world's vocabulary —
    leaf, frisbee disc, beach ball, music note, coconut, wave, sparkle — so the
    page is patterned with its own things rather than generic squiggles.

    Laid out on a 5x5 jittered grid: hand-placing gave clumps in one
    corner and bald patches in another, which is exactly what makes a repeat
    read as a repeat. Every shape is clamped inside the tile, so it repeats
    seamlessly with no wrap maths. Colour is one flat green; the opacity that
    makes it tone-on-tone lives in overview.css.
  -->
  <defs>
    <g id="leaf" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 11 Q11 -6 22 11 Q11 28 0 11 Z"/>
      <path d="M2 11 H20"/>
