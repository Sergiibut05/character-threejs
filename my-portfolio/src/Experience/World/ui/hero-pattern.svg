    <g id="disc" stroke-linecap="round">
      <ellipse cx="14" cy="7" rx="14" ry="6"/>
      <ellipse cx="14" cy="7" rx="6" ry="2.4"/>
    </g>
    <g id="ball" stroke-linecap="round">
